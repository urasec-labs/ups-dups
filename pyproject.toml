[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ups-dups-enterprise"
version = "0.1.0"
description = "Independent compact decoder-only Transformer and MoE engineering scaffold"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["torch==2.10.0", "fastapi==0.128.2", "uvicorn==0.48.0", "pydantic==2.13.5", "PyYAML==6.0.3"]

[tool.setuptools]
packages = ["model", "training", "inference", "api", "data", "evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
